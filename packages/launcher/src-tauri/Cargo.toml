[package]
name = "hardlyui-launcher"
version = "0.2.2"
description = "HardlyUI project launcher — pick a Hardly project and start its editor build"
edition = "2021"
publish = false

[lib]
name = "hardlyui_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
open = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
